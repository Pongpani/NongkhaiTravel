<!doctype html><html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NongkhaiTravel.com</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="data:,">
</head>
<body class="bg-sky-50 text-slate-800">
<header class="bg-white shadow"><div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
  <h1 class="text-xl md:text-2xl font-bold">รายละเอียดสถานที่</h1>
  <nav class="space-x-4 text-sm">
    <a href="./index.html" class="hover:underline">หน้าแรก</a>
    <a href="./places.html" class="hover:underline">สถานที่ท่องเที่ยว</a>
    <a href="./about.html" class="hover:underline">เกี่ยวกับจังหวัด</a>
    <a href="./contact.html" class="hover:underline">ติดต่อเรา</a>
  </nav>
</div></header>
<main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
  <div id="content" class="bg-white rounded-2xl shadow p-6"></div>
</main>
<footer class="text-center text-xs text-slate-500 py-8">© NongkhaiTravel.com</footer>
<script>
async function load(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const res = await fetch('./data/places.json'); const places = await res.json();
  const p = places.find(x => x.id===id);
  const el = document.getElementById('content');
  if(!p) { el.innerHTML = '<div>ไม่พบข้อมูล</div>'; return; }
  el.innerHTML = `
    <h2 class="text-xl font-semibold mb-2">${p.name_th}</h2>
    <div class="aspect-video bg-slate-200 rounded-xl overflow-hidden mb-4">
      <img src="${p.image}" alt="${p.name_th}" class="w-full h-full object-cover">
    </div>
    <p class="text-sm text-slate-700 mb-4">${p.desc}</p>
    <div class="rounded-xl overflow-hidden border">
      <iframe src="${p.maps_embed}" width="100%" height="360" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
    </div>`;
}
load();
</script></body></html>
