<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>รายละเอียดสถานที่ | NongkhaiTravel.com</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light; }
  body {
    font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', 'Sarabun', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f6f3ed;
  }
  .mekong-line {
    height: 3px;
    background-image: linear-gradient(90deg, rgba(13,148,136,0.9) 0%, rgba(13,148,136,0.9) 24%, transparent 24%, transparent 50%),
                      linear-gradient(90deg, rgba(13,148,136,0.15) 0%, rgba(13,148,136,0.15) 50%, transparent 50%, transparent 100%);
    background-size: 28px 3px, 56px 3px;
    border-radius: 9999px;
  }
</style>
</head>
<body class="text-slate-800">
<header class="border-b border-slate-200/70 bg-white/80 backdrop-blur">
  <div class="mx-auto flex max-w-6xl flex-col gap-4 px-4 py-6 md:flex-row md:items-center md:justify-between">
    <div>
      <a href="./index.html" class="text-lg font-semibold tracking-tight text-slate-900 md:text-xl">NongkhaiTravel.com</a>
      <p class="mt-1 text-sm text-slate-500">รายละเอียดสถานที่เที่ยวในบรรยากาศมินิมอล</p>
    </div>
    <nav class="flex flex-wrap items-center gap-2 text-sm text-slate-600">
      <a href="./index.html" class="rounded-full px-4 py-1.5 transition hover:bg-slate-100">หน้าแรก</a>
      <a href="./places.html" class="rounded-full px-4 py-1.5 transition hover:bg-slate-100">สถานที่ท่องเที่ยว</a>
      <a href="./about.html" class="rounded-full px-4 py-1.5 transition hover:bg-slate-100">เกี่ยวกับจังหวัด</a>
      <a href="./contact.html" class="rounded-full px-4 py-1.5 transition hover:bg-slate-100">ติดต่อเรา</a>
      <a href="./admin.html" class="rounded-full px-4 py-1.5 transition hover:bg-slate-100">Admin</a>
    </nav>
  </div>
  <div class="mekong-line"></div>
</header>

<main class="mx-auto max-w-4xl px-4 py-12">
  <div id="content" class="space-y-6"></div>
</main>

<footer class="border-t border-slate-200/70 bg-white/80 py-8 text-center text-xs text-slate-500">© NongkhaiTravel.com — ตามรอยสถานที่สำคัญในหนองคาย</footer>

<script>
async function load(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  try {
    const res = await fetch('./data/places.json');
    const places = await res.json();
    const place = places.find(p => p.id === id);
    render(place);
  } catch (error) {
    console.error('โหลดข้อมูลไม่สำเร็จ', error);
    render(null);
  }
}
function render(place){
  const el = document.getElementById('content');
  if (!place) {
    el.innerHTML = `
      <section class="rounded-3xl border border-dashed border-slate-300 bg-white/80 p-8 text-center text-sm text-slate-600">
        ไม่พบข้อมูลสถานที่ <br class="hidden sm:block">ลองกลับไปดูรายการทั้งหมดที่ <a href="./places.html" class="font-medium text-teal-700 underline">หน้าสถานที่ท่องเที่ยว</a>
      </section>
    `;
    return;
  }
  el.innerHTML = `
    <article class="space-y-6 rounded-3xl border border-slate-200/70 bg-white/90 p-8">
      <header class="space-y-2">
        <p class="text-xs font-medium uppercase tracking-[0.28em] text-teal-600">NONG KHAI</p>
        <h1 class="text-3xl font-semibold text-slate-900">${place.name_th}</h1>
        <p class="text-sm font-medium text-teal-600">อ.${place.district} จังหวัดหนองคาย</p>
      </header>
      <div class="aspect-video overflow-hidden rounded-2xl bg-slate-200">
        <img src="${place.image}" alt="${place.name_th}" class="h-full w-full object-cover">
      </div>
      <p class="text-base leading-relaxed text-slate-600">${place.desc}</p>
      <div class="rounded-2xl border border-slate-200">
        <iframe src="${place.maps_embed}" width="100%" height="360" style="border:0;" allowfullscreen loading="lazy"></iframe>
      </div>
    </article>
  `;
}
load();
</script>
</body>
</html>
